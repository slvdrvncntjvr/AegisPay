# Local PostgreSQL 17 only. Not a hosted deployment or an application stack.
# Set AEGISPAY_POSTGRES_PASSWORD in the process environment without logging it.
# Do not print `docker compose config`: interpolation includes the password.
# Use `docker compose -f deployment/compose.postgres.yaml config --quiet`.
services:
  db:
    # Official library/postgres digest, verified against Docker Hub registry.
    # Observed PostgreSQL 17.11 on linux/amd64 on 2026-11-07.
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: aegispay
      POSTGRES_USER: aegispay
      POSTGRES_PASSWORD: ${AEGISPAY_POSTGRES_PASSWORD:?Set a local database password privately}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${AEGISPAY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegispay", "-d", "aegispay"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes:
  postgres_data:
